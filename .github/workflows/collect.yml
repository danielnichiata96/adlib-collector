name: coletor diário

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read          # já não escreve aqui: a série vai para adlib-data

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Escrever configuração a partir do Secret
        env:
          NICHES: ${{ secrets.NICHES }}
        run: |
          if [ -z "$NICHES" ]; then
            echo "::error::Secret NICHES em falta"; exit 1
          fi
          printf '%s' "$NICHES" > niches.json
          python3 -c "import json;d=json.load(open('niches.json'));print(f\"{len(d['queries'])} consultas configuradas\")"

      - name: Recolher
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          if [ -z "$META_TOKEN" ]; then
            echo "::error::Secret META_TOKEN em falta"; exit 1
          fi
          python3 -u scripts/collect_daily.py

      # A série longitudinal não vive neste repositório. Este é público — tem de
      # ser, porque a quota gratuita de Actions em repositório privado está
      # esgotada — e o código pode ser público sem custo. A série não pode: a
      # janela do arquivo da Meta é móvel de 12 meses e o dia não capturado
      # deixa de existir. Vai por chave de implantação para adlib-data, privado.
      # A chave é de escrita e só abre aquele repositório.
      - name: Publicar a série no repositório privado
        env:
          DEPLOY_KEY: ${{ secrets.DATA_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Secret DATA_DEPLOY_KEY em falta — a recolha de hoje perder-se-ia"
            exit 1
          fi
          shopt -s nullglob
          novos=(data/snapshots/*.jsonl.gz)
          if [ ${#novos[@]} -eq 0 ]; then
            echo "::error::nenhum ficheiro recolhido"; exit 1
          fi

          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone --quiet git@github.com:danielnichiata96/adlib-data.git ../dados
          mkdir -p ../dados/data/snapshots
          cp "${novos[@]}" ../dados/data/snapshots/
          cd ../dados
          git config user.name  "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add data/snapshots
          if git diff --staged --quiet; then
            echo "::warning::nada de novo"
          else
            git commit -q -m "Snapshot de $(date -u +%Y-%m-%d)"
            git push --quiet
            echo "${#novos[@]} ficheiros gravados em adlib-data"
          fi

      - name: Validade do token
        if: always()
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          exp=$(curl -s "https://graph.facebook.com/v26.0/debug_token?input_token=$META_TOKEN&access_token=$META_TOKEN" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('data',{}).get('expires_at',0))" 2>/dev/null || echo 0)
          if [ "${exp:-0}" -gt 0 ]; then
            d=$(( (exp - $(date +%s)) / 86400 ))
            echo "Token expira em $d dias"
            if [ "$d" -lt 10 ]; then echo "::warning::Token expira em $d dias — renovar e actualizar o Secret"; fi
          fi
          exit 0
