name: coletor diário

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

concurrency:
  group: coletor
  cancel-in-progress: false

jobs:
  recolher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Escrever configuração a partir do Secret
        env:
          NICHES: ${{ secrets.NICHES }}
        run: |
          if [ -z "$NICHES" ]; then
            echo "::error::Secret NICHES em falta"; exit 1
          fi
          printf '%s' "$NICHES" > niches.json
          python3 -c "import json;d=json.load(open('niches.json'));print(f\"{len(d['queries'])} consultas configuradas\")"

      - name: Recolher
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          if [ -z "$META_TOKEN" ]; then
            echo "::error::Secret META_TOKEN em falta"; exit 1
          fi
          python3 -u scripts/collect_daily.py

      - name: Commitar
        run: |
          rm -f niches.json
          git config user.name  "coletor"
          git config user.email "coletor@users.noreply.github.com"
          git add -f data/snapshots/*.jsonl.gz 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "::warning::nada de novo"
          else
            git commit -m "Snapshot de $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Validade do token
        if: always()
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: |
          exp=$(curl -s "https://graph.facebook.com/v26.0/debug_token?input_token=$META_TOKEN&access_token=$META_TOKEN" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('data',{}).get('expires_at',0))" 2>/dev/null || echo 0)
          if [ "${exp:-0}" -gt 0 ]; then
            d=$(( (exp - $(date +%s)) / 86400 ))
            echo "Token expira em $d dias"
            if [ "$d" -lt 10 ]; then echo "::warning::Token expira em $d dias — renovar e actualizar o Secret"; fi
          fi
          exit 0
